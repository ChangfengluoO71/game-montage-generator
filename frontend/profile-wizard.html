<section class="profile-wizard" id="profileWizard" hidden>
  <div class="wizard-head"><button class="back-link" id="profileBack">← 返回游戏配置</button><span class="kicker">CUSTOM PROFILE / SETUP</span><h2>创建自定义游戏配置</h2><p>用一个击杀标志和一张完整分辨率画面，建立可复用的检测规则。</p></div>
  <div class="profile-steps"><span class="current">1 游戏信息</span><span>2 上传样本</span><span>3 检测区域</span><span>4 确认保存</span></div>
  <section class="profile-page active" data-profile-page="1"><div class="form-card"><label>游戏名称<input id="customGameName" placeholder="例如：The Finals" /></label><label>高光事件名称<input id="customEventLabel" placeholder="例如：OWN_KILL" value="OWN_KILL" /></label><label>检测方式<select id="detectorType"><option value="template_match">区域标志匹配</option><option value="skull_row">骷髅/图标行</option></select></label></div><div class="wizard-actions"><button class="primary" data-profile-next="2">下一步：上传样本 →</button></div></section>
  <section class="profile-page" data-profile-page="2"><div class="upload-grid"><label class="upload-box"><input id="markerSample" type="file" accept="image/*" hidden><b>＋ 上传击杀标志区域图</b><small>建议：裁剪后的清晰标志图 PNG</small><em id="markerName">未选择</em></label><label class="upload-box"><input id="fullSample" type="file" accept="image/*,video/*" hidden><b>＋ 上传完整分辨率正例</b><small>标志出现时的完整画面或视频</small><em id="fullName">未选择</em></label><label class="upload-box optional"><input id="negativeSample" type="file" accept="image/*,video/*" hidden><b>＋ 上传负样本（可选）</b><small>没有该标志的相似画面</small><em id="negativeName">未选择</em></label></div><div class="wizard-actions"><button class="back-link" data-profile-next="1">← 返回</button><button class="primary" data-profile-next="3">下一步：设置区域 →</button></div></section>
  <section class="profile-page" data-profile-page="3"><div class="roi-card"><div class="roi-preview"><div class="roi-box"><span>ROI</span></div><div class="crosshair">+</div></div><div class="roi-controls"><h3>检测区域（归一化坐标）</h3><p>同一套配置可适配不同分辨率。先用默认区域，后续可由本地 worker 校准。</p><div class="coord-grid"><label>X1<input id="roiX1" type="number" min="0" max="1" step="0.01" value="0.30"></label><label>Y1<input id="roiY1" type="number" min="0" max="1" step="0.01" value="0.55"></label><label>X2<input id="roiX2" type="number" min="0" max="1" step="0.01" value="0.48"></label><label>Y2<input id="roiY2" type="number" min="0" max="1" step="0.01" value="0.74"></label></div><label>匹配阈值<input id="threshold" type="range" min="0.1" max="0.99" step="0.01" value="0.65"><output id="thresholdValue">0.65</output></label></div></div><div class="wizard-actions"><button class="back-link" data-profile-next="2">← 返回</button><button class="primary" data-profile-next="4">下一步：确认配置 →</button></div></section>
  <section class="profile-page" data-profile-page="4"><div class="profile-review"><div class="review-icon">✓</div><h3 id="reviewName">自定义游戏</h3><p id="reviewEvent">OWN_KILL · 区域标志匹配</p><div class="review-grid"><span>区域 <b id="reviewRoi">0.30, 0.55 → 0.48, 0.74</b></span><span>阈值 <b id="reviewThreshold">0.65</b></span><span>标志样本 <b id="reviewMarker">未选择</b></span><span>完整正例 <b id="reviewFull">未选择</b></span></div></div><div class="wizard-actions"><button class="back-link" data-profile-next="3">← 返回</button><button class="primary" id="saveProfile">✓ 保存游戏配置</button></div></section>
</section>
